[project]
name = "policygate-rag"
version = "0.0.1"
description = "How much of banking_knowledge task failure is a retrieval problem: a retrieval study on tau2-bench under the policygate harness"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # The harness, pinned to a tag. It is a dependency, never a workspace:
    # changes to it are made in the PolicyGate repo, tagged, and re-pinned here.
    "policygate",
    # tau2 pulls in litellm, tenacity, fastapi, loguru, deepdiff, pandas,
    # pytest-xdist and plotly. Do not re-declare those here.
    "tau2[knowledge,experiments]",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
# The published repository, pinned to a tag. Not a path source: a path would
# track PolicyGate's working tree, so this study's results would move whenever
# that tree did.
policygate = { git = "https://github.com/Jackson117/PolicyGate.git", tag = "v0.3.0" }
# Same commit as PolicyGate's pin; see third_party/PIN.md.
tau2 = { path = "third_party/tau2-bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policygate_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
